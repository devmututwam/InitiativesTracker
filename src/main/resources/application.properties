spring.application.name=InitiativesTracker

# Server
server.port=${SERVER_PORT:3014}
server.servlet.context-path=/tracker

# Datasource (override via env vars)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/initiatives_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (override via env vars)
app.jwt.secret=${JWT_SECRET:change-me-to-a-secure-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
